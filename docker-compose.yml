version: "3.8"

name: my-messaging-project

services:
  app:
    build: .
    container_name: messaging_app_backend
    restart: always
    ports:
      - "8000:8000"

    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/data/database.sqlite

    volumes:
      - sqlite_data:/app/data

    networks:
      - app-network
      - jenkins-net
      
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins_server
    restart: always
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-network
      - jenkins-net

volumes:
  sqlite_data:
  jenkins_home:

networks:
  app-network:
    driver: bridge
  jenkins-net:
    driver: bridge
